name: Android build

# Compiles the Android app on every push that touches it and keeps an installable APK.
on:
  push:
    paths:
      - "android/**"
      - "Atala/Resources/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ATALA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER)) ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: atala-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

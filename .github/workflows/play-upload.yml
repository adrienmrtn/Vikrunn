name: Google Play upload

# Sends a signed .aab, committed alone on a temporary branch, to a Google Play testing track.
# Started by hand: Actions > Google Play upload > Run workflow. Never production.
on:
  workflow_dispatch:
    inputs:
      bundle_branch:
        description: "Temporary branch that holds the .aab (delete it afterwards)"
        required: true
      track:
        description: "Testing track"
        type: choice
        options: [internal, alpha]
        default: internal
      apply:
        description: "Send to the testers (off = upload and check only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bundle_branch }}
          path: bundle
      - name: Find the bundle
        run: |
          test "$(ls bundle/*.aab | wc -l)" = "1"
          mv bundle/*.aab bundle.aab
      - name: Upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python tools/play_upload.py bundle.aab ${{ inputs.track }} ${{ inputs.apply && '--apply' || '' }}
